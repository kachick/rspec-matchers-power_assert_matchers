# https://docs.github.com/ja/actions/reference/workflow-syntax-for-github-actions
name: Spec
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/spec.yml'
      - '.ruby-version'
      - '**.gemspec'
      - 'Gemfile'
      - 'gemfiles'
      - 'Rakefile'
      - '**.rb'
  pull_request:
    paths:
      - '.github/workflows/spec.yml'
      - '.ruby-version'
      - '**.gemspec'
      - 'Gemfile'
      - 'gemfiles'
      - 'Rakefile'
      - '**.rb'
permissions:
  contents: read

jobs:
  rspec:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04]
        ruby: ['head', '4.0', '3.4']
        gemfile: ['Gemfile', 'gemfiles/oldest.gemfile']
    runs-on: ${{ matrix.os }}
    env: # $BUNDLE_GEMFILE must be set at the job level, so it is set for all steps
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}
      # https://github.com/kachick/irb-power_assert/blob/104834846baf5caa1e8536a11c43acdd56fc849c/CONTRIBUTING.md#adding-dependencies-for-this-gem
      BUNDLE_WITHOUT: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          # Enabling is the recommended way, but it cannot detect runner changes in early stage.
          # So disable it is better for test job, do not mind in other jobs
          bundler-cache: false # runs 'bundle install' and caches installed gems automatically
      - run: bundle install
      - run: bundle exec rake spec

  rubocop:
    runs-on: 'ubuntu-26.04'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - run: bundle exec rake rubocop
